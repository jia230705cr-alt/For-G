<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给最爱的你 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* 漂浮爱心背景 */
        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: floatUp linear infinite;
            user-select: none;
            z-index: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        /* 主卡片容器 */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 105, 135, 0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 10;
            transition: all 0.5s ease;
        }
        .emoji-header {
            font-size: 64px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }
        button {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #yesBtn {
            background: linear-gradient(45deg, #ff4081, #ff79b0);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
        }
        #yesBtn:hover {
            transform: scale(1.08);
        }
        #noBtn {
            background: #e0e0e0;
            color: #666;
            position: relative;
        }
        /* 惊喜信件页面 */
        .letter-content {
            display: none;
            text-align: left;
            animation: fadeIn 1s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .letter-content h2 {
            color: #d81b60;
            text-align: center;
            margin-bottom: 15px;
        }
        .letter-text {
            background: #fff5f8;
            padding: 20px;
            border-radius: 15px;
            color: #444;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 20px;
            border-left: 4px solid #ff4081;
        }
        .signature {
            text-align: right;
            font-weight: bold;
            color: #d81b60;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <!-- 初始互动界面 -->
        <div id="questionBox">
            <div class="emoji-header">🥺👉👈</div>
            <h1>老公，我错啦...</h1>
            <p>是我没有耐心 说话不好听了 我已严肃反思 下次肯定改 肯定做你最最最贴心的女朋友 <br>看在我这么诚恳的份上，原谅我好不好嘛？</p>
            <div class="btn-group">
                <button id="yesBtn">原谅你啦 ❤️</button>
                <button id="noBtn">不原谅 😤</button>
            </div>
        </div>

        <!-- 点击原谅后的惊喜信件 -->
        <div class="letter-content" id="letterBox">
            <div class="emoji-header" style="text-align: center;">🥰🎉</div>
            <h2>我老公这么好！嘻嘻！我想你了！就知道你会原谅我哒 </h2>
            <div class="letter-text">
                <!-- 👇 这里可以改成你想对TA说的话 -->
                可能我情绪上来了就口不择言 我也在改 没有第一时间考虑你是我的错嘛<br><br>
                以后我一定多站在你的角度想问题 少一点脾气 多一点耐心 不在你累的时候还和你闹脾气了 肯定稳稳接住你的情绪！违反一次我就好好补偿你好不好呀<br><br>
                我超级爱你！巨巨巨爱你哦～
                <div class="signature">—— 🐱听话小猫在线撒娇</div>
            </div>
        </div>
    </div>

    <script>
        // 1. 生成背景漂浮爱心
        function createHearts() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = ['❤️', '💖', '💕', '🌸'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHearts, 400);

        // 2. “不原谅”按钮逃跑逻辑
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const phrases = [
            "点不到我略略略 😝",
            "再考虑一下嘛 🥺",
            "把我最爱的小蛋糕给你 别和我生气啦🍰",
            "我保证下次不这样了 🥹",
            "老公～",
            "你忍心和你家小猫生气嘛 🐱"
        ];
        let yesScale = 1;

        function moveButton() {
            // 每次逃跑，“原谅”按钮变大一点
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;

            // 随机切换求饶文案
            noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];

            // 计算屏幕内的随机位置
            const x = (Math.random() - 0.5) * 200;
            const y = (Math.random() - 0.5) * 200;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 防止手机端直接触发点击
            moveButton();
        });

        // 3. 点击“原谅”后的切换效果
        yesBtn.addEventListener('click', () => {
            document.getElementById('questionBox').style.display = 'none';
            document.getElementById('letterBox').style.display = 'block';
            // 爆发一波爱心雨
            for(let i = 0; i < 30; i++) {
                setTimeout(createHearts, i * 50);
            }
        });
    </script>
</body>
</html>
