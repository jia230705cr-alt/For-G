<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给最爱的老公 💖</title>
    <!-- 引入可爱圆润手写体与正文字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Quicksand:wght@600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 马卡龙多巴胺柔和渐变背景：蜜桃粉 -> 奶油黄 -> 薄荷冰蓝 */
            background: linear-gradient(125deg, #ffd6e0 0%, #fff3d6 45%, #d4f1f9 100%);
            background-size: 200% 200%;
            animation: gradientFlow 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-family: 'Quicksand', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #6b5b6e;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 漂浮马卡龙小元素背景 */
        .float-item {
            position: absolute;
            animation: floatUp linear infinite;
            user-select: none;
            z-index: 0;
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(255, 182, 193, 0.3));
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg) scale(0.7); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(25deg) scale(1.1); opacity: 0; }
        }

        /* 奶油马卡龙主卡片 */
        .card-wrapper {
            position: relative;
            max-width: 430px;
            width: 90%;
            z-index: 10;
        }

        /* 可爱小猫耳朵装饰 */
        .cat-ears {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 30px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
            pointer-events: none;
        }

        .ear {
            width: 36px;
            height: 36px;
            background: #fff9fb;
            border: 3px solid #ffb5c8;
            border-radius: 8px 24px 4px 24px;
            transform: rotate(-15deg);
            box-shadow: 0 -4px 10px rgba(255, 166, 193, 0.2);
        }

        .ear.right {
            transform: rotate(105deg);
        }

        .ear::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            width: 16px;
            height: 16px;
            background: #ffc8d7;
            border-radius: 4px 12px 2px 12px;
        }

        .card {
            background: rgba(255, 253, 254, 0.92);
            backdrop-filter: blur(12px);
            padding: 36px 28px 34px;
            border-radius: 32px;
            border: 3px solid #ffffff;
            box-shadow: 
                0 18px 40px rgba(255, 160, 185, 0.25),
                0 0 0 6px rgba(255, 214, 224, 0.45);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 顶部小标签 */
        .badge {
            display: inline-block;
            background: #ffe8ef;
            color: #ff7597;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .emoji-header {
            font-size: 62px;
            margin-bottom: 10px;
            display: inline-block;
            animation: wiggle 2.5s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-4deg) scale(1); }
            50% { transform: rotate(4deg) scale(1.06); }
        }

        /* 可爱快乐体标题 */
        h1 {
            font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', cursive, sans-serif;
            color: #ff6b8b;
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 14px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #ffe6ec;
        }

        p {
            color: #7a687d;
            font-size: 15.5px;
            line-height: 1.75;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            position: relative;
            min-height: 54px;
        }

        button {
            padding: 13px 26px;
            border: none;
            border-radius: 50px;
            font-size: 15.5px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Quicksand', 'Noto Sans SC', sans-serif;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 马卡龙草莓粉主按钮 */
        #yesBtn {
            background: linear-gradient(135deg, #ff8fab 0%, #ff6b8b 100%);
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(255, 117, 151, 0.4), inset 0 2px 2px rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        #yesBtn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 22px rgba(255, 117, 151, 0.5);
        }

        /* 马卡龙芋泥灰蓝逃跑按钮 */
        #noBtn {
            background: #eef2f7;
            color: #8c96a6;
            border: 2px solid #dfe6ef;
            position: relative;
            z-index: 1;
            white-space: nowrap;
        }

        /* 惊喜信件页面 */
        .letter-content {
            display: none;
            text-align: left;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .letter-content h2 {
            font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', cursive, sans-serif;
            color: #ff6b8b;
            font-size: 22px;
            font-weight: 400;
            text-align: center;
            line-height: 1.45;
            margin-bottom: 18px;
        }

        /* 信纸质感文本框 */
        .letter-text {
            background: linear-gradient(180deg, #fff9fb 0%, #fff4f7 100%);
            padding: 22px 20px;
            border-radius: 22px;
            color: #6b5b6e;
            font-size: 15px;
            line-height: 1.85;
            border: 2px dashed #ffc2d4;
            position: relative;
        }

        .signature {
            margin-top: 16px;
            text-align: right;
            font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', cursive, sans-serif;
            font-size: 17px;
            color: #ff7597;
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <!-- 顶部小猫耳朵 -->
        <div class="cat-ears">
            <div class="ear left"></div>
            <div class="ear right"></div>
        </div>

        <div class="card" id="mainCard">
            <!-- 初始互动界面 -->
            <div id="questionBox">
                <div class="badge">🐾 紧急认错小电报 🐾</div>
                <br>
                <div class="emoji-header">🥺👉👈</div>
                <h1>老公，我错啦...</h1>
                <p>是我没有耐心 说话不好听了 我已严肃反思<br>下次肯定改 肯定做你最最最贴心的女朋友<br>看在我这么诚恳的份上，原谅我好不好嘛？</p>
                <div class="btn-group">
                    <button id="yesBtn">原谅你啦 ❤️</button>
                    <button id="noBtn">不原谅 😤</button>
                </div>
            </div>

            <!-- 点击原谅后的惊喜信件 -->
            <div class="letter-content" id="letterBox">
                <div style="text-align: center;">
                    <div class="badge">✨ 和好契约达成 ✨</div>
                    <br>
                    <div class="emoji-header">🥰🎉</div>
                </div>
                <h2>我老公这么好！嘻嘻！我想你了！<br>就知道你会原谅我哒 ~</h2>
                <div class="letter-text">
                    可能我情绪上来了就口不择言，我也在改，没有第一时间考虑你是我的错嘛。<br><br>
                    以后我一定多站在你的角度想问题，少一点脾气，多一点耐心，不在你累的时候还和你闹脾气了，肯定稳稳接住你的情绪！违反一次我就好好补偿你好不好呀？<br><br>
                    我超级爱你！巨巨巨爱你哦～
                    <div class="signature">—— 🐱 听话小猫在线撒娇</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 生成背景漂浮马卡龙可爱元素
        const icons = ['🩷', '🩵', '💛', '🐾', '🍰', '✨', '🌸', '🍓'];
        function createFloatItems() {
            const item = document.createElement('div');
            item.classList.add('float-item');
            item.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            item.style.left = Math.random() * 96 + 'vw';
            item.style.fontSize = (Math.random() * 16 + 16) + 'px';
            item.style.animationDuration = (Math.random() * 4 + 5) + 's';
            document.body.appendChild(item);
            setTimeout(() => item.remove(), 9000);
        }
        setInterval(createFloatItems, 450);

        // 2. “不原谅”按钮逃跑逻辑
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const phrases = [
            "点不到我略略略 😝",
            "再考虑一下嘛 🥺",
            "把我最爱的小蛋糕给你 🍰",
            "别和我生气啦求求 🥹",
            "老公～ 💗",
            "你忍心和你家小猫生气嘛 🐱"
        ];
        let yesScale = 1;

        function moveButton() {
            // 每次逃跑，“原谅”按钮变大一点（限制最大倍数防止遮挡）
            if (yesScale < 1.8) {
                yesScale += 0.12;
                yesBtn.style.transform = `scale(${yesScale})`;
            }

            // 随机切换求饶文案
            noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];

            // 限制在合理范围内随机跳动，防止跑出手机屏幕
            const x = (Math.random() - 0.5) * 160;
            const y = (Math.random() - 0.5) * 160;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // 3. 点击“原谅”后的切换效果
        yesBtn.addEventListener('click', () => {
            document.getElementById('questionBox').style.display = 'none';
            document.getElementById('letterBox').style.display = 'block';
            // 爆发一波马卡龙爱心蛋糕雨
            for(let i = 0; i < 35; i++) {
                setTimeout(createFloatItems, i * 45);
            }
        });
    </script>
</body>
</html>
